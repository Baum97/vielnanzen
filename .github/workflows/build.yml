name: Build (Android & iOS)

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Analyse & Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.9'
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

  android:
    name: Android-APK
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.9'
          cache: true
      - run: flutter pub get
      # Optional: FinTS-Produkt-ID als Repository-Secret FINTS_PRODUCT_ID hinterlegen.
      - run: flutter build apk --release --dart-define=FINTS_PRODUCT_ID=${{ secrets.FINTS_PRODUCT_ID }}
      # App-Bundle (Play Store) ebenfalls bauen – prüft den Release-Weg bei jedem Push.
      - run: flutter build appbundle --release --dart-define=FINTS_PRODUCT_ID=${{ secrets.FINTS_PRODUCT_ID }}
      - uses: actions/upload-artifact@v4
        with:
          name: klarblick-android-apk
          path: |
            build/app/outputs/flutter-apk/app-release.apk
            build/app/outputs/bundle/release/app-release.aab
          retention-days: 30

  ios:
    name: iOS-Build (ohne Signatur)
    needs: test
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.9'
          cache: true
      - run: flutter pub get
      - run: flutter build ios --release --no-codesign --dart-define=FINTS_PRODUCT_ID=${{ secrets.FINTS_PRODUCT_ID }}

name: Android Release (APK + AAB)

# Tag pushen (z. B. `git tag v1.1.0 && git push origin v1.1.0`) → GitHub-Release mit APK und AAB.
# Manuell starten (Actions → Run workflow) → nur Build, Dateien als Artefakt.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Feste Flutter-Version: Android-Gradle-Plugin, Kotlin und Gradle im Projekt
      # passen genau zu dieser Version. Beim Aktualisieren alle Workflows anpassen.
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.9'
          cache: true

      - run: flutter pub get
      - run: flutter test

      # Optionale eigene Signatur (für den Play Store). Secrets:
      # ANDROID_KEYSTORE_BASE64 (base64 der .jks), ANDROID_KEYSTORE_PASSWORD,
      # ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD. Ohne Secrets: Debug-Signatur.
      - name: Signatur einrichten
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 --decode > android/app/upload-keystore.jks
            {
              echo "storeFile=upload-keystore.jks"
              echo "storePassword=$KEYSTORE_PASSWORD"
              echo "keyAlias=$KEY_ALIAS"
              echo "keyPassword=$KEY_PASSWORD"
            } > android/key.properties
            echo "Release-Signatur aktiv."
          else
            echo "::warning::Kein Keystore-Secret – APK wird mit dem Debug-Schlüssel signiert (installierbar, nicht für den Play Store)."
          fi

      - name: Version bestimmen
        id: version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            NAME="${GITHUB_REF_NAME#v}"
          else
            NAME="$(grep '^version:' pubspec.yaml | sed 's/version: *//; s/+.*//')"
          fi
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "Version $NAME, Build ${{ github.run_number }}"

      - name: APK bauen
        run: >
          flutter build apk --release
          --build-name=${{ steps.version.outputs.name }}
          --build-number=${{ github.run_number }}
          --dart-define=FINTS_PRODUCT_ID=${{ secrets.FINTS_PRODUCT_ID }}

      - name: App-Bundle bauen
        run: >
          flutter build appbundle --release
          --build-name=${{ steps.version.outputs.name }}
          --build-number=${{ github.run_number }}
          --dart-define=FINTS_PRODUCT_ID=${{ secrets.FINTS_PRODUCT_ID }}

      - name: Dateien benennen
        run: |
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk "dist/klarblick-${{ steps.version.outputs.name }}.apk"
          cp build/app/outputs/bundle/release/app-release.aab "dist/klarblick-${{ steps.version.outputs.name }}.aab"
          ls -la dist

      - uses: actions/upload-artifact@v4
        with:
          name: klarblick-${{ steps.version.outputs.name }}
          path: dist/*
          retention-days: 30

      - name: GitHub-Release erstellen
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true

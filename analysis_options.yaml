# Statische Analyse für Klarblick.
# Aktivieren mit `flutter analyze`. Die Regeln stammen aus package:flutter_lints.
include: package:flutter_lints/flutter.yaml

analyzer:
  exclude:
    - build/**
    - android/**
    - ios/**
    - web/**
  language:
    strict-casts: false

linter:
  rules:
    prefer_single_quotes: true
    prefer_const_constructors: true
    avoid_print: true
    always_declare_return_types: true
    unawaited_futures: false

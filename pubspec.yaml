name: klarblick
description: "Klarblick – kostenlose, rein lokale Finanz-App. Alle Daten bleiben verschlüsselt auf dem Gerät."
publish_to: 'none'

version: 1.1.0+2

environment:
  sdk: ^3.13.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^3.5.0
  path_provider: ^2.1.6
  intl: ^0.20.2
  collection: ^1.19.1
  xml: ^7.1.0
  file_picker: ^13.3.2
  shared_preferences: ^2.5.6
  crypto: ^3.0.8
  cryptography: ^2.9.0
  flutter_secure_storage: ^11.2.0
  local_auth: ^3.0.2
  share_plus: ^13.3.1
  fints: ^0.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/data/categories.json
    - assets/data/merchants.json
    - assets/data/creditor_ids.json
    - assets/data/banks.json
